
name: Сборка Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-проект
        run: flutter create --org com.volna --project-name volna --platforms=android .

      - name: Настроить плеер и иконку
        run: dart run tool/patch_android.dart

      - name: Загрузить зависимости
        run: flutter pub get

      - name: Проверка кода
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Автотесты
        continue-on-error: true
        run: flutter test

      - name: Собрать APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: volna-apk
          path: build/app/outputs/flutter-apk/app-release.apk
